name: Tag Release Check

on:
  push:
    tags:
      - "v*"

concurrency:
  group: tag-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-sanity:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build web app
        run: npm run build

